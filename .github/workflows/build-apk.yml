name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Trouver le dossier du projet
        id: p
        run: echo "dir=$(dirname "$(find . -maxdepth 3 -name pubspec.yaml -not -path '*/packages/*' | head -1)")" >> "$GITHUB_OUTPUT"

      - name: Generer le dossier android
        working-directory: ${{ steps.p.outputs.dir }}
        run: flutter create --org com.example --project-name game_launcher --platforms=android .

      - name: Installer les paquets
        working-directory: ${{ steps.p.outputs.dir }}
        run: flutter pub get

      - name: Compiler l'APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: game-launcher-apk
          path: ${{ steps.p.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
