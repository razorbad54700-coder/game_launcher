name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Trouver le dossier du projet
        id: p
        run: echo "dir=$(dirname "$(find . -maxdepth 3 -name pubspec.yaml -not -path '*/packages/*' | head -1)")" >> "$GITHUB_OUTPUT"

      - name: Generer le dossier android
        working-directory: ${{ steps.p.outputs.dir }}
        run: flutter create --org com.example --project-name game_launcher --platforms=android .

      - name: Installer les paquets
        working-directory: ${{ steps.p.outputs.dir }}
        run: flutter pub get

      - name: Icone personnalisee (si assets/icon/icon.png existe)
        working-directory: ${{ steps.p.outputs.dir }}
        run: |
          if [ -f assets/icon/icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            cat > flutter_launcher_icons.yaml <<'CFG'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/icon/icon.png"
            adaptive_icon_background: "#05060B"
            adaptive_icon_foreground: "assets/icon/icon.png"
            adaptive_icon_foreground_inset: 16
          CFG
            dart run flutter_launcher_icons
          else
            echo "Pas d'icone personnalisee : icone Flutter par defaut."
          fi

      - name: Compiler l'APK
        working-directory: ${{ steps.p.outputs.dir }}
        run: flutter build apk --release

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: game-launcher-apk
          path: ${{ steps.p.outputs.dir }}/build/app/outputs/flutter-apk/app-release.apk
